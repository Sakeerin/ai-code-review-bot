name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history with Gitleaks
        working-directory: ${{ runner.temp }}
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location "$base/$archive" --output "$archive"
          curl --fail --silent --show-error --location "$base/$checksums" --output "$checksums"
          grep " $archive$" "$checksums" | sha256sum --check -
          tar -xzf "$archive" gitleaks
          ./gitleaks git "$GITHUB_WORKSPACE" --log-opts=--all --redact=100 --no-banner
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test tests
      - run: bun run --cwd apps/dashboard build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          BETTER_AUTH_SECRET: build-only-placeholder-secret-32-characters
          NEXT_PUBLIC_APP_URL: http://localhost:3001
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build -f Dockerfile.dashboard -t review-dashboard .
      - run: docker build -f Dockerfile.webhook -t review-webhook .
