name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test tests
      - run: bun run --cwd apps/dashboard build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          BETTER_AUTH_SECRET: build-only-placeholder-secret-32-characters
          NEXT_PUBLIC_APP_URL: http://localhost:3001
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.dashboard -t review-dashboard .
      - run: docker build -f Dockerfile.webhook -t review-webhook .
